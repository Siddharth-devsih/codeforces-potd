<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codeforces POTD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="w-80 bg-slate-900 text-slate-100 font-sans p-4 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="flex items-center justify-between pb-3 border-b border-slate-800">
    <div class="flex items-center space-x-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-sm font-bold tracking-wide uppercase text-slate-300">CF POTD</h1>
    </div>
    <div class="flex items-center space-x-2">
      <!-- Streak Badge -->
      <div id="streak-badge" class="hidden items-center space-x-1 text-xs font-bold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30">
        <span>🔥</span>
        <span id="streak-count">0</span>
      </div>
      <!-- User Rating Chip -->
      <div id="user-rating-chip" class="hidden text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
        <span id="header-handle">--</span>: <span id="header-rating">--</span>
      </div>
    </div>
  </header>

  <!-- Handle Setup View -->
  <section id="view-setup" class="hidden mt-4">
    <p class="text-xs text-slate-400 mb-3 leading-relaxed">
      Enter your Codeforces username to receive daily problems matched to your current rating bracket.
    </p>
    <form id="setup-form" class="space-y-3">
      <div>
        <label for="handle-input" class="block text-xs font-medium text-slate-300 mb-1">Codeforces Handle</label>
        <input 
          type="text" 
          id="handle-input" 
          required 
          placeholder="e.g. tourist" 
          class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>
      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 transition-colors py-2 px-3 rounded-md text-xs font-semibold text-white shadow-sm flex items-center justify-center space-x-1"
      >
        <span>Save & Generate POTD</span>
      </button>
    </form>
  </section>

  <!-- Loading State -->
  <section id="view-loading" class="hidden py-10 flex flex-col items-center justify-center space-y-3">
    <div class="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
    <span class="text-xs text-slate-400 font-medium">Fetching problem set...</span>
  </section>

  <!-- Error State -->
  <section id="view-error" class="hidden mt-4 p-3 bg-red-950/40 border border-red-800/60 rounded-md">
    <p id="error-message" class="text-xs text-red-400 leading-relaxed"></p>
    <button id="btn-error-retry" class="mt-2 text-xs font-semibold text-red-300 underline hover:text-red-200">
      Try again
    </button>
  </section>

  <!-- Problem Display Card -->
  <main id="view-problem" class="hidden mt-3 space-y-3">
    <div class="bg-slate-800/80 border border-slate-700/60 rounded-lg p-3 shadow-inner">
      <div class="flex items-center justify-between mb-1.5">
        <span id="problem-id" class="text-[11px] font-mono text-slate-400 font-medium tracking-tight"></span>
        <span id="problem-rating-badge" class="text-[10px] font-bold px-2 py-0.5 rounded border"></span>
      </div>

      <h2 id="problem-title" class="text-sm font-semibold text-white line-clamp-2 leading-snug"></h2>

      <div id="problem-tags" class="flex flex-wrap gap-1 mt-2.5"></div>
    </div>

    <!-- Solved Status Banner -->
    <div id="solved-status" class="hidden items-center space-x-1.5 py-1.5 px-2.5 rounded bg-emerald-950/40 border border-emerald-800/50 text-emerald-400 text-xs font-medium">
      <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
      </svg>
      <span>Problem solved! Streak updated!</span>
    </div>

    <!-- Actions -->
    <div class="space-y-2 pt-1">
      <a 
        id="btn-solve" 
        href="#" 
        target="_blank" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white transition-colors py-2 px-3 rounded-md text-xs font-semibold flex items-center justify-center space-x-1.5 shadow"
      >
        <span>Solve on Codeforces</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
        </svg>
      </a>

      <div class="grid grid-cols-2 gap-2">
        <button 
          id="btn-verify" 
          class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors py-1.5 px-2 rounded-md text-[11px] font-medium flex items-center justify-center space-x-1"
        >
          <span>Check Status</span>
        </button>
        <button 
          id="btn-reroll" 
          class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors py-1.5 px-2 rounded-md text-[11px] font-medium flex items-center justify-center space-x-1"
        >
          <span>New Problem</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Footer Actions -->
  <footer class="mt-4 pt-2 border-t border-slate-800/80 flex items-center justify-between text-[10px] text-slate-500">
    <button id="btn-change-handle" class="hover:text-slate-400 transition-colors underline">Change Handle</button>
    <span id="bracket-info"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
